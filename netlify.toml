[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # These NEXT_PUBLIC_* keys are intentionally embedded in the client bundle.
  # YOUTUBE_API_KEY is server-only (API route) but Netlify scans build output.
  # Whitelisting them so the secrets scanner doesn't block the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,YOUTUBE_API_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
